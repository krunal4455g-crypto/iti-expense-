<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ITI Expense Tracker</title>
<style>:root{--bg:#f3f5f9;--card:#fff;--ink:#14203a;--mut:#5d6a85;--line:#dde3ee;--navy:#0f1f3d;--acc:#2f6fdf;--ok:#12703f;--okbg:#e2f5ea;--warn:#8a5a00;--warnbg:#fdf0d5;--bad:#a52a2a;--badbg:#fbe5e5}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Segoe UI",system-ui,sans-serif}
h2,h3{margin:0}button,input,select,textarea{font:inherit;color:inherit}
.side{position:fixed;inset:0 auto 0 0;width:216px;background:var(--navy);padding:18px 10px;display:none;flex-direction:column;gap:4px}
.side b{color:#fff;padding:0 10px 12px}.bot{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--navy)}
.nav{flex:1;background:none;border:0;color:#dbe5fb;padding:11px 8px;cursor:pointer;text-align:left;border-radius:6px}.nav.on{background:#27407a;color:#fff}
main{padding:14px 14px 80px;max-width:1100px;margin:auto}
@media(min-width:820px){.side{display:flex}.bot{display:none}main{margin-left:216px;max-width:none;padding:24px 28px}}
.top,.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.top{justify-content:space-between;margin-bottom:14px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-bottom:16px}.tg{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px}.k{color:var(--mut);font-size:13px}.v{font-size:22px;font-weight:650}
.btn{background:var(--acc);color:#fff;border:0;border-radius:6px;padding:8px 14px;cursor:pointer;font-weight:600}.btn.s{background:var(--card);color:var(--ink);border:1px solid var(--line)}.btn.d{background:var(--bad)}.sm{padding:4px 10px;font-size:13px}
input,select,textarea{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%}
.f{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--mut)}.fl{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:12px}
.tw{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:8px}table{border-collapse:collapse;width:100%;min-width:760px;font-size:14px}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--mut);font-size:13px}.n{text-align:right}
.tag{padding:1px 9px;border-radius:99px;font-size:12px;font-weight:600}.Paid{background:var(--okbg);color:var(--ok)}.Partially{background:var(--warnbg);color:var(--warn)}.Unpaid{background:var(--badbg);color:var(--bad)}
.empty{padding:28px;text-align:center;color:var(--mut)}.err{color:var(--bad);font-size:13px;margin:6px 0}
.ov{position:fixed;inset:0;background:rgba(5,10,25,.55);overflow:auto;padding:20px 12px;display:flex;justify-content:center;align-items:flex-start}.box{background:var(--card);border-radius:10px;padding:18px;width:100%;max-width:640px}
.login{max-width:360px;margin:12vh auto;display:flex;flex-direction:column;gap:10px}
.bar{height:8px;background:#e8f0fd;border-radius:4px}.bar i{display:block;height:100%;background:var(--acc);border-radius:4px}
.cr{display:grid;grid-template-columns:120px 1fr 90px;gap:8px;align-items:center;margin:7px 0;font-size:13px}
</style></head><body><div id="root"><p style="padding:28px;text-align:center">Loading…</p></div>
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.25.6/babel.min.js"></script>
<script type="text/babel" data-presets="react">
const {useEffect,useState}=React;
const sb=window.supabase.createClient('https://mwaiclvccmvvcubscfjt.supabase.co','sb_publishable_D9n6SK1fUaxE8eqVv3jLBA_SYL3EZIx');
const CATS=["Tools & Equipment","Raw Materials","Consumables","Maintenance & Repairs","Utilities","Training Aids","Other"]
const METHODS=["Cash","UPI","Bank Transfer","Cheque"]
const inr=n=>'₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2})
const ym=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`
const now=new Date(),CM=ym(now),TD=`${CM}-${String(now.getDate()).padStart(2,'0')}`
const mname=m=>new Date(m+'-01T00:00').toLocaleString('en-IN',{month:'long',year:'numeric'})
const prevM=m=>{const d=new Date(m+'-01T00:00');d.setMonth(d.getMonth()-1);return ym(d)}
const sum=l=>({tot:l.reduce((a,e)=>a+ +e.amount,0),paid:l.reduce((a,e)=>a+ +e.amount_paid,0),n:l.length,get out(){return this.tot-this.paid}})
const inM=(l,m)=>l.filter(e=>e.expense_date.startsWith(m))
const chg=(a,b)=>b?`${a>=b?'+':''}${((a-b)/b*100).toFixed(1)}%`:'—'
const csv=r=>r.map(x=>x.map(c=>`"${String(c??'').replace(/"/g,'""')}"`).join(',')).join('\n')
function download(name,text){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/csv'}));a.download=name;a.click()}
const Card=({k,v})=><div className="card"><div className="k">{k}</div><div className="v">{v}</div></div>
const Tag=({s})=><span className={'tag '+s.split(' ')[0]}>{s}</span>

function App(){
 const [s,setS]=useState(undefined)
 useEffect(()=>{sb.auth.getSession().then(({data})=>setS(data.session));const {data}=sb.auth.onAuthStateChange((_,x)=>setS(x));return()=>data.subscription.unsubscribe()},[])
 if(s===undefined)return <p className="empty">Loading…</p>
 return s?<Main/>:<Login/>
}
function Login(){
 const [e,setE]=useState(''),[p,setP]=useState(''),[err,setErr]=useState(''),[b,setB]=useState(false)
 const go=async ev=>{ev.preventDefault();setB(true);setErr('');const {error}=await sb.auth.signInWithPassword({email:e,password:p});if(error)setErr(error.message);setB(false)}
 return <form className="login card" onSubmit={go}><h2>ITI Expense Tracker</h2><input type="email" placeholder="Email" value={e} onChange={x=>setE(x.target.value)} required/><input type="password" placeholder="Password" value={p} onChange={x=>setP(x.target.value)} required/>{err&&<div className="err">{err}</div>}<button className="btn" disabled={b}>{b?'Signing in…':'Sign in'}</button><span className="k">Accounts are created by your administrator.</span></form>
}
function Main(){
 const [me,setMe]=useState(null),[trades,setT]=useState([]),[exps,setX]=useState([]),[users,setU]=useState([]),[view,setV]=useState('dash'),[tid,setTid]=useState(null),[modal,setM]=useState(null),[err,setErr]=useState(''),[load,setL]=useState(true)
 const reload=async()=>{
  const {data:{user}}=await sb.auth.getUser()
  const [p,t,x]=await Promise.all([sb.from('profiles').select('*').eq('id',user.id).single(),sb.from('trades').select('*').order('name'),sb.from('expenses').select('*').order('expense_date',{ascending:false}).limit(5000)])
  const e=p.error||t.error||x.error;setErr(e?e.message:'')
  setMe(p.data);setT(t.data||[]);setX(x.data||[])
  if(p.data?.role==='admin'){const u=await sb.from('profiles').select('*').order('full_name');setU(u.data||[])}
  setL(false)}
 useEffect(()=>{reload()},[])
 if(load)return <p className="empty">Loading…</p>
 const out=<button className="btn s sm" onClick={()=>sb.auth.signOut()}>Sign out</button>
 if(!me||me.role==='none')return <div className="login card"><h2>Access pending</h2><p>Your account has no role yet. Ask your administrator to assign one.</p>{err&&<div className="err">{err}</div>}{out}</div>
 const R=me.role,admin=R==='admin',canAdd=R!=='authority'
 const tn=id=>trades.find(t=>t.id===id)?.name||'?'
 const items=[['dash','Dashboard'],['exp','Expenses'],...(admin?[['trades','Trades'],['users','Users']]:[]),['rep','Reports']]
 const nav=items.map(i=><button key={i[0]} className={'nav '+(view===i[0]?'on':'')} onClick={()=>{setV(i[0]);setTid(null)}}>{i[1]}</button>)
 const open=t=>{setTid(t);setV('exp')}
 return <>
  <aside className="side"><b>ITI Expense Tracker</b>{nav}</aside><nav className="bot">{nav}</nav>
  <main>
   <div className="top"><span className="k">{me.full_name} · {R==='admin'?'Administrator':R==='incharge'?'Trade In-charge':'Higher Authority'}</span>{out}</div>
   {err&&<div className="err">{err}</div>}
   {view==='dash'&&<Dash trades={trades} exps={exps} open={open}/>}
   {view==='exp'&&<Exps key={tid||'all'} trades={trades} exps={exps} tid={tid} tn={tn} admin={admin} canAdd={canAdd} role={R} me={me} setM={setM} back={tid&&admin||tid&&R==='authority'?()=>{setTid(null);setV('dash')}:null}/>}
   {view==='trades'&&<Trades trades={trades} exps={exps} reload={reload} setErr={setErr}/>}
   {view==='users'&&<Users users={users} trades={trades} reload={reload} setErr={setErr}/>}
   {view==='rep'&&<Report trades={trades} exps={exps}/>}
  </main>
  {modal&&<Form {...modal} trades={trades} me={me} close={()=>setM(null)} done={()=>{setM(null);reload()}}/>}
 </>
}
function Dash({trades,exps,open}){
 const s=sum(exps)
 return <><h2 style={{marginBottom:12}}>Dashboard</h2>
  <div className="grid"><Card k="Total recorded" v={inr(s.tot)}/><Card k="This month recorded" v={inr(sum(inM(exps,CM)).tot)}/><Card k="Total paid" v={inr(s.paid)}/><Card k="Total pending" v={inr(s.out)}/><Card k="Active trades" v={trades.filter(t=>t.active).length}/></div>
  <div className="grid tg">{trades.map(t=>{const l=exps.filter(e=>e.trade_id===t.id);return <div className="card" key={t.id} style={{opacity:t.active?1:.65}}><h3>{t.name}{!t.active&&' (inactive)'}</h3><div className="k">In-charge: {t.incharge_name||'Not assigned'}</div><div className="v">{inr(sum(l).tot)}</div><div className="k">This month {inr(sum(inM(l,CM)).tot)} · {l.length} records</div><button className="btn sm" style={{marginTop:10}} onClick={()=>open(t.id)}>View details</button></div>})}</div>
  {!trades.length&&<div className="empty card">No trades yet. An administrator can add them under Trades.</div>}</>
}
function Exps({trades,exps,tid,tn,admin,canAdd,role,me,setM,back}){
 const [f,setF]=useState({}),set=(k,v)=>setF({...f,[k]:v})
 const base=tid?exps.filter(e=>e.trade_id===tid):exps
 const q=(f.q||'').toLowerCase()
 const l=base.filter(e=>(!q||[e.title,e.supplier,e.invoice_no].some(x=>(x||'').toLowerCase().includes(q)))&&(!f.tr||e.trade_id===f.tr)&&(!f.from||e.expense_date>=f.from)&&(!f.to||e.expense_date<=f.to)&&(!f.m||e.expense_date.startsWith(f.m))&&(!f.c||e.category===f.c)&&(!f.s||e.status===f.s))
 const s=sum(l),months=[...new Set([...base.map(e=>e.expense_date.slice(0,7)),CM])].sort().reverse()
 const cats=Object.entries(base.reduce((m,e)=>(m[e.category]=(m[e.category]||0)+ +e.amount,m),{})).sort((a,b)=>b[1]-a[1]),ts=sum(base).tot
 const canEdit=e=>admin||(role==='incharge'&&e.trade_id===me.trade_id)
 const viewBill=async p=>{const {data,error}=await sb.storage.from('bills').createSignedUrl(p,60);if(error)alert(error.message);else window.open(data.signedUrl,'_blank')}
 const exp=()=>download('expenses.csv',csv([['ID','Date','Title','Trade','Category','Supplier','Invoice','Total','Paid','Outstanding','Status','Method'],...l.map(e=>[e.code,e.expense_date,e.title,tn(e.trade_id),e.category,e.supplier,e.invoice_no,e.amount,e.amount_paid,e.amount-e.amount_paid,e.status,e.payment_method])]))
 const L=(t,i)=><label className="f">{t}{i}</label>
 return <>
  <div className="top"><h2>{tid?tn(tid):'Expenses'}</h2><div className="row">{back&&<button className="btn s sm" onClick={back}>Back</button>}{canAdd&&<button className="btn sm" onClick={()=>setM({tid})}>Add expense</button>}</div></div>
  {tid&&<div className="grid"><Card k="Total recorded" v={inr(sum(base).tot)}/><Card k="This month" v={inr(sum(inM(base,CM)).tot)}/><Card k="Paid" v={inr(sum(base).paid)}/><Card k="Outstanding" v={inr(sum(base).out)}/></div>}
  {tid&&<div className="card" style={{marginBottom:16}}><h3>Category breakdown</h3>{cats.map(([c,a])=><div className="cr" key={c}><span>{c}</span><div className="bar"><i style={{width:(a/ts*100)+'%'}}/></div><span className="n">{inr(a)}</span></div>)}{!cats.length&&<div className="empty">No expenses yet.</div>}</div>}
  <div className="fl">{L('Search',<input placeholder="Title, supplier, invoice" onChange={e=>set('q',e.target.value)}/>)}{!tid&&L('Trade',<select onChange={e=>set('tr',e.target.value)}><option value="">All</option>{trades.map(t=><option key={t.id} value={t.id}>{t.name}</option>)}</select>)}{L('From',<input type="date" onChange={e=>set('from',e.target.value)}/>)}{L('To',<input type="date" onChange={e=>set('to',e.target.value)}/>)}{L('Month',<select onChange={e=>set('m',e.target.value)}><option value="">All</option>{months.map(m=><option key={m} value={m}>{mname(m)}</option>)}</select>)}{L('Category',<select onChange={e=>set('c',e.target.value)}><option value="">All</option>{CATS.map(c=><option key={c}>{c}</option>)}</select>)}{L('Payment',<select onChange={e=>set('s',e.target.value)}><option value="">All</option><option>Paid</option><option>Partially Paid</option><option>Unpaid</option></select>)}</div>
  <div className="row" style={{marginBottom:10}}><button className="btn s sm" onClick={exp} disabled={!l.length}>Export CSV</button><span className="k">{s.n} records · {inr(s.tot)} total · {inr(s.out)} outstanding</span></div>
  {l.length?<div className="tw"><table><thead><tr><th>ID</th><th>Date</th><th>Title</th><th>Trade</th><th>Category</th><th>Supplier</th><th className="n">Total</th><th className="n">Paid</th><th className="n">Due</th><th>Status</th><th>Bill</th><th/></tr></thead><tbody>{l.map(e=><tr key={e.id}><td>{e.code}</td><td>{e.expense_date}</td><td>{e.title}</td><td>{tn(e.trade_id)}</td><td>{e.category}</td><td>{e.supplier}</td><td className="n">{inr(e.amount)}</td><td className="n">{inr(e.amount_paid)}</td><td className="n">{inr(e.amount-e.amount_paid)}</td><td><Tag s={e.status}/></td><td>{e.bill_path?<button className="btn s sm" onClick={()=>viewBill(e.bill_path)}>Open</button>:'—'}</td><td>{canEdit(e)&&<button className="btn s sm" onClick={()=>setM({e})}>Edit</button>}</td></tr>)}</tbody></table></div>:<div className="empty card">No expenses match. Change the filters or add an expense.</div>}
 </>
}
function Form({e,tid,trades,me,close,done}){
 const [f,setF]=useState(e?{...e,amount:e.amount,amount_paid:e.amount_paid||''}:{trade_id:tid||(me.role==='incharge'?me.trade_id:''),expense_date:TD,category:CATS[0],status:'Unpaid',amount:'',amount_paid:'',title:'',supplier:'',invoice_no:'',remarks:'',payment_method:''})
 const [file,setFile]=useState(null),[err,setErr]=useState(''),[busy,setB]=useState(false),set=(k,v)=>setF({...f,[k]:v})
 const opts=trades.filter(t=>t.active||t.id===f.trade_id)
 async function save(){
  const a=parseFloat(f.amount);let paid=f.status==='Paid'?a:0
  if(!f.title?.trim())return setErr('Enter an expense title.')
  if(!f.trade_id)return setErr('Select a trade.')
  if(!f.expense_date||isNaN(new Date(f.expense_date)))return setErr('Enter a valid date.')
  if(f.expense_date>TD)return setErr('Date cannot be in the future.')
  if(!(a>0))return setErr('Amount must be a positive number.')
  if(!f.supplier?.trim())return setErr('Enter the supplier or payee name.')
  if(f.status==='Partially Paid'){paid=parseFloat(f.amount_paid);if(!(paid>0&&paid<a))return setErr('Amount paid must be more than 0 and less than the total.')}
  if(f.status!=='Unpaid'&&!f.payment_method)return setErr('Select a payment method.')
  if(file&&file.size>5*1024*1024)return setErr('Bill must be 5 MB or smaller.')
  setB(true);setErr('')
  const row={trade_id:f.trade_id,title:f.title.trim(),expense_date:f.expense_date,amount:a,category:f.category,remarks:f.remarks||null,supplier:f.supplier.trim(),invoice_no:f.invoice_no||null,status:f.status,amount_paid:paid,payment_method:f.status==='Unpaid'?null:f.payment_method}
  let id=e?.id,error
  if(id)({error}=await sb.from('expenses').update(row).eq('id',id))
  else{const r=await sb.from('expenses').insert(row).select('id').single();error=r.error;id=r.data?.id}
  if(!error&&file){const path=`${row.trade_id}/${id}/${Date.now()}-${file.name.replace(/[^\w.-]/g,'_')}`;const u=await sb.storage.from('bills').upload(path,file);if(u.error)error=u.error;else{const r=await sb.from('expenses').update({bill_path:path}).eq('id',id);error=r.error}}
  setB(false);if(error)return setErr(error.message);done()}
 async function del(){if(!confirm('Delete this expense? Totals will change.'))return;const {error}=await sb.from('expenses').delete().eq('id',e.id);if(error)setErr(error.message);else done()}
 const L=(t,i)=><label className="f">{t}{i}</label>
 return <div className="ov"><div className="box"><h3>{e?'Edit '+e.code:'Add expense'}</h3><div className="fl" style={{marginTop:12}}>
  {L('Title *',<input value={f.title} onChange={x=>set('title',x.target.value)}/>)}
  {L('Trade *',<select value={f.trade_id} disabled={me.role==='incharge'} onChange={x=>set('trade_id',x.target.value)}><option value="">Select</option>{opts.map(t=><option key={t.id} value={t.id}>{t.name}</option>)}</select>)}
  {L('Date *',<input type="date" max={TD} value={f.expense_date} onChange={x=>set('expense_date',x.target.value)}/>)}
  {L('Amount (₹) *',<input type="number" min="0.01" step="0.01" value={f.amount} onChange={x=>set('amount',x.target.value)}/>)}
  {L('Category *',<select value={f.category} onChange={x=>set('category',x.target.value)}>{CATS.map(c=><option key={c}>{c}</option>)}</select>)}
  {L('Supplier / payee *',<input value={f.supplier} onChange={x=>set('supplier',x.target.value)}/>)}
  {L('Invoice / bill no.',<input value={f.invoice_no||''} onChange={x=>set('invoice_no',x.target.value)}/>)}
  {L('Payment status *',<select value={f.status} onChange={x=>set('status',x.target.value)}><option>Paid</option><option>Partially Paid</option><option>Unpaid</option></select>)}
  {f.status==='Partially Paid'&&L('Amount paid (₹)',<input type="number" min="0" step="0.01" value={f.amount_paid} onChange={x=>set('amount_paid',x.target.value)}/>)}
  {f.status!=='Unpaid'&&L('Payment method',<select value={f.payment_method||''} onChange={x=>set('payment_method',x.target.value)}><option value="">Select</option>{METHODS.map(m=><option key={m}>{m}</option>)}</select>)}
  {L('Bill (PDF/image, max 5 MB)',<input type="file" accept="application/pdf,image/jpeg,image/png,image/webp" onChange={x=>setFile(x.target.files[0])}/>)}</div>
  {L('Remarks',<textarea rows="2" value={f.remarks||''} onChange={x=>set('remarks',x.target.value)}/>)}
  {err&&<div className="err">{err}</div>}
  <div className="row" style={{marginTop:10}}><button className="btn" onClick={save} disabled={busy}>{busy?'Saving…':'Save expense'}</button><button className="btn s" onClick={close}>Cancel</button>{e&&me.role==='admin'&&<button className="btn d" onClick={del}>Delete</button>}</div></div></div>
}
function Trades({trades,exps,reload,setErr}){
 const [n,setN]=useState(''),[i,setI]=useState('')
 const add=async()=>{if(!n.trim())return setErr('Enter a trade name.');const {error}=await sb.from('trades').insert({name:n.trim(),incharge_name:i.trim()||null});setErr(error?(error.code==='23505'?'A trade with this name already exists.':error.message):'');if(!error){setN('');setI('');reload()}}
 const upd=async(id,p)=>{const {error}=await sb.from('trades').update(p).eq('id',id);setErr(error?error.message:'');reload()}
 return <><h2 style={{marginBottom:12}}>Trade management</h2>
  <div className="card fl" style={{alignItems:'end'}}><label className="f">New trade name<input value={n} onChange={e=>setN(e.target.value)}/></label><label className="f">In-charge name<input value={i} onChange={e=>setI(e.target.value)}/></label><button className="btn" onClick={add}>Add trade</button></div>
  <div className="tw"><table><thead><tr><th>Trade</th><th>In-charge</th><th>Records</th><th>Status</th><th/></tr></thead><tbody>{trades.map(t=><tr key={t.id}><td>{t.name}</td><td>{t.incharge_name||'—'}</td><td>{exps.filter(e=>e.trade_id===t.id).length}</td><td>{t.active?'Active':'Inactive'}</td><td><button className="btn s sm" onClick={()=>{const v=prompt('Trade name',t.name);if(v&&v.trim())upd(t.id,{name:v.trim()})}}>Rename</button> <button className="btn s sm" onClick={()=>{const v=prompt('In-charge name',t.incharge_name||'');if(v!==null)upd(t.id,{incharge_name:v.trim()||null})}}>In-charge</button> <button className="btn s sm" onClick={()=>upd(t.id,{active:!t.active})}>{t.active?'Deactivate':'Reactivate'}</button></td></tr>)}</tbody></table></div>
  <p className="k">Deactivating keeps all past records. Trades cannot be deleted.</p></>
}
function Users({users,trades,reload,setErr}){
 const upd=async(id,p)=>{const {error}=await sb.from('profiles').update(p).eq('id',id);setErr(error?error.message:'');reload()}
 return <><h2 style={{marginBottom:12}}>User assignments</h2><p className="k">Create users in Supabase Auth, then assign a role and trade here.</p>
  <div className="tw"><table><thead><tr><th>User</th><th>Role</th><th>Trade (for in-charge)</th></tr></thead><tbody>{users.map(u=><tr key={u.id}><td>{u.full_name}</td><td><select value={u.role} onChange={e=>upd(u.id,{role:e.target.value,...(e.target.value!=='incharge'?{trade_id:null}:{})})}><option value="none">No access</option><option value="admin">Administrator</option><option value="incharge">Trade In-charge</option><option value="authority">Higher Authority</option></select></td><td>{u.role==='incharge'?<select value={u.trade_id||''} onChange={e=>upd(u.id,{trade_id:e.target.value||null})}><option value="">Select trade</option>{trades.map(t=><option key={t.id} value={t.id}>{t.name}</option>)}</select>:'—'}</td></tr>)}</tbody></table></div></>
}
function Report({trades,exps}){
 const [m,setM]=useState(CM),pm=prevM(m),cur=inM(exps,m),prv=inM(exps,pm),s=sum(cur),ps=sum(prv)
 const months=[...new Set([...exps.map(e=>e.expense_date.slice(0,7)),CM])].sort().reverse()
 const rows=trades.map(t=>[t.name,sum(cur.filter(e=>e.trade_id===t.id)).tot,sum(prv.filter(e=>e.trade_id===t.id)).tot])
 const cats=CATS.map(c=>[c,sum(cur.filter(e=>e.category===c)).tot]).filter(x=>x[1])
 const exp=()=>download(`report-${m}.csv`,csv([['Report',mname(m)],[],['Trade','This month','Previous month','Change'],...rows.map(r=>[...r,chg(r[1],r[2])]),['Total',s.tot,ps.tot,chg(s.tot,ps.tot)],[],['Category','Amount'],...cats,[],['Paid',s.paid],['Outstanding',s.out]]))
 return <><div className="top"><h2>Monthly report</h2><div className="row"><select style={{width:'auto'}} value={m} onChange={e=>setM(e.target.value)}>{months.map(x=><option key={x} value={x}>{mname(x)}</option>)}</select><button className="btn s sm" onClick={exp}>Export report</button></div></div>
  <div className="grid"><Card k="Total recorded" v={inr(s.tot)}/><Card k={'vs '+mname(pm)} v={chg(s.tot,ps.tot)}/><Card k="Paid" v={inr(s.paid)}/><Card k="Outstanding" v={inr(s.out)}/></div>
  <div className="tw" style={{marginBottom:16}}><table style={{minWidth:0}}><thead><tr><th>Trade</th><th className="n">This month</th><th className="n">Previous</th><th className="n">Change</th></tr></thead><tbody>{rows.map(r=><tr key={r[0]}><td>{r[0]}</td><td className="n">{inr(r[1])}</td><td className="n">{inr(r[2])}</td><td className="n">{chg(r[1],r[2])}</td></tr>)}<tr><th>Total</th><th className="n">{inr(s.tot)}</th><th className="n">{inr(ps.tot)}</th><th className="n">{chg(s.tot,ps.tot)}</th></tr></tbody></table></div>
  <div className="card"><h3>By category</h3>{cats.map(([c,a])=><div className="cr" key={c}><span>{c}</span><div className="bar"><i style={{width:(s.tot?a/s.tot*100:0)+'%'}}/></div><span className="n">{inr(a)}</span></div>)}{!cats.length&&<div className="empty">No expenses in this month.</div>}</div></>
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
